[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oramasys-telos"
version = "0.1.0a1"
description = "Purpose-scoped endpoint-use authorization for Oramasys"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/telos"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

